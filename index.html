  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>TreeD™ Hybrid Tree Inventory — PlanIT Geo™<\u002Ftitle>\n  <style>\n    /* ── RESET ──────────────────────────────────────────────────────────────── */\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    html { scroll-behavior: smooth; }\n    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #143052; color: #eef4fb; overflow-x: hidden; }\n    a { color: inherit; text-decoration: none; }\n\n    /* ── BRAND TOKENS — derived from PlanIT Geo logo & website ─────────────── */\n    :root {\n      /* Logo colours */\n      --pg-blue:        #1B75BC;   /* \"PlanIT\" blue — dominant brand */\n      --pg-blue-dark:   #0d5a96;\n      --pg-blue-deep:   #083d6b;\n      --pg-green:       #5EAC3A;   /* \"IT\" / \"Geo\" green */\n      --pg-green-dark:  #3d7a23;\n      --pg-gold:        #F5A500;   /* logo icon gold accent */\n      /* Page backgrounds — lifted navy-forest (hero stays dark for the point cloud) */\n      --bg-deep:        #0e2038;\n      --bg-dark:        #143052;\n      --bg-mid:         #1a3a5e;\n      --bg-card:        rgba(255,255,255,.06);\n      --bg-card-hover:  rgba(27,117,188,.16);\n      /* Text */\n      --text-white:     #ffffff;\n      --text-light:     #dbe7f4;\n      --text-muted:     #a8bed4;\n      /* Borders */\n      --border:         rgba(27,117,188,.26);\n      --border-bright:  rgba(27,117,188,.5);\n    }\n\n    /* ── UTILITIES ──────────────────────────────────────────────────────────── */\n    .container { max-width: 1160px; margin: 0 auto; padding: 0 2rem; }\n    .section-label {\n      font-size: .72rem; font-weight: 700; letter-spacing: .2em;\n      text-transform: uppercase; color: var(--pg-green); margin-bottom: .9rem;\n    }\n    .section-title {\n      font-size: clamp(1.9rem, 4vw, 2.9rem); font-weight: 800;\n      line-height: 1.15; margin-bottom: 1.1rem; color: var(--text-white);\n    }\n    .section-sub {\n      font-size: 1.05rem; line-height: 1.75; color: var(--text-muted);\n      max-width: 680px;\n    }\n\n    /* ── SCROLL REVEAL ──────────────────────────────────────────────────────── */\n    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .6s ease, transform .6s ease; }\n    .reveal.visible { opacity: 1; transform: none; }\n    .d1 { transition-delay: .1s; } .d2 { transition-delay: .2s; }\n    .d3 { transition-delay: .3s; } .d4 { transition-delay: .4s; }\n\n    /* ── NAV ────────────────────────────────────────────────────────────────── */\n    nav {\n      position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n      display: flex; align-items: center; justify-content: space-between;\n      padding: .75rem 2.5rem;\n      background: rgba(7,17,30,.95);\n      backdrop-filter: blur(14px);\n      border-bottom: 1px solid var(--border);\n      transition: background .3s;\n    }\n    .nav-logo img { height: 36px; display: block; }\n    .nav-links { display: flex; align-items: center; gap: 2rem; list-style: none; }\n    .nav-links a { font-size: .87rem; font-weight: 500; color: var(--text-muted); transition: color .2s; }\n    .nav-links a:hover { color: var(--text-white); }\n    .nav-cta {\n      background: var(--pg-blue) !important; color: #fff !important;\n      padding: .5rem 1.25rem; border-radius: 4px; font-weight: 700 !important;\n      transition: background .2s, transform .15s !important;\n    }\n    .nav-cta:hover { background: var(--pg-blue-dark) !important; transform: translateY(-1px); }\n\n    /* ── HERO ───────────────────────────────────────────────────────────────── */\n    #hero {\n      min-height: 100vh;\n      display: flex; flex-direction: column; justify-content: center;\n      padding: 8rem 2rem 5rem;\n      position: relative; overflow: hidden;\n      background: linear-gradient(135deg, #07111e 0%, #0d2442 55%, #0a1e38 100%);\n    }\n    /* Animated glow orbs */\n    .orb { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(90px); }\n    .orb-1 { width: 600px; height: 600px; top: -150px; right: -100px;\n              background: radial-gradient(circle, rgba(27,117,188,.28) 0%, transparent 65%);\n              animation: drift 10s ease-in-out infinite; }\n    .orb-2 { width: 400px; height: 400px; bottom: 5%; left: -50px;\n              background: radial-gradient(circle, rgba(94,172,58,.15) 0%, transparent 65%);\n              animation: drift 13s ease-in-out infinite reverse; }\n    .orb-3 { width: 320px; height: 320px; top: 35%; right: 15%;\n              background: radial-gradient(circle, rgba(245,165,0,.12) 0%, transparent 65%);\n              animation: drift 9s ease-in-out infinite 2s; }\n    @keyframes drift {\n      0%,100% { transform: translate(0,0); }\n      33% { transform: translate(20px,-25px); }\n      66% { transform: translate(-15px,15px); }\n    }\n\n    /* Point-cloud dot grid */\n    .hero-grid {\n      position: absolute; inset: 0; pointer-events: none;\n      background-image: radial-gradient(circle, rgba(27,117,188,.3) 1px, transparent 1px);\n      background-size: 44px 44px; opacity: .07;\n      mask-image: radial-gradient(ellipse 85% 75% at 65% 40%, black 0%, transparent 68%);\n    }\n\n    /* LiDAR point-cloud canvas */\n    #lidar-canvas {\n      position: absolute; inset: 0; width: 100%; height: 100%;\n      z-index: 1; pointer-events: none; display: block;\n    }\n    /* Vignette + readability scrim so hero copy stays legible over the scene */\n    .hero-scrim {\n      position: absolute; inset: 0; z-index: 1; pointer-events: none;\n      background:\n        linear-gradient(90deg, rgba(7,17,30,.86) 0%, rgba(7,17,30,.5) 40%, rgba(7,17,30,.12) 70%, rgba(7,17,30,0) 100%),\n        linear-gradient(0deg, rgba(7,17,30,.85) 0%, rgba(7,17,30,0) 30%);\n    }\n    /* horizon-line glow that the scan sweep crosses */\n    .hero-haze {\n      position: absolute; inset: 0; z-index: 1; pointer-events: none;\n      background: radial-gradient(ellipse 70% 42% at 62% 44%, rgba(27,117,188,.16) 0%, transparent 60%);\n    }\n\n    /* drag-to-look affordance */\n    #hero { cursor: grab; }\n    #hero.td-grabbing { cursor: grabbing; }\n    .hero-inner { cursor: default; }\n\n    /* live LiDAR inventory tags projected onto feature trees */\n    .td-tag {\n      position: absolute; left: 0; top: 0; z-index: 2;\n      pointer-events: none; opacity: 0;\n      transition: opacity .4s ease; will-change: transform, opacity;\n    }\n    .td-tag.active { opacity: 1; }\n    .td-card {\n      background: rgba(8,19,34,.82);\n      -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);\n      border: 1px solid rgba(94,172,58,.42); border-left: 3px solid var(--pg-green);\n      border-radius: 8px; padding: .5rem .72rem; min-width: 156px;\n      box-shadow: 0 8px 26px rgba(0,0,0,.45);\n      transform: translateY(8px) scale(.94); opacity: 0;\n      transition: transform .42s cubic-bezier(.2,.85,.25,1), opacity .42s ease, border-color .25s, box-shadow .25s;\n    }\n    .td-tag.active .td-card { transform: none; opacity: 1; }\n    .td-tag.hot .td-card {\n      border-color: rgba(245,165,0,.5); border-left-color: var(--pg-gold);\n      box-shadow: 0 10px 30px rgba(245,165,0,.22);\n    }\n    .tdt-id { font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--pg-green); font-weight: 800; }\n    .td-tag.hot .tdt-id { color: var(--pg-gold); }\n    .tdt-species { font-size: .85rem; font-weight: 700; font-style: italic; color: #fff; margin-top: .12rem; }\n    .tdt-common { font-size: .64rem; color: var(--text-muted); margin-bottom: .38rem; }\n    .tdt-rows { display: flex; gap: .55rem; align-items: center; }\n    .tdt-rows span { font-size: .64rem; color: var(--text-light); font-variant-numeric: tabular-nums; letter-spacing: .02em; }\n    .tdt-rows b { color: #fff; font-weight: 700; }\n    .tdt-cond { color: var(--pg-green) !important; font-weight: 700; }\n\n    /* interaction hint */\n    .hero-hint {\n      position: absolute; bottom: 1.9rem; right: 2rem; z-index: 3;\n      display: flex; gap: .5rem; opacity: 0; pointer-events: none;\n      animation: hintIn 1s ease 1.4s forwards; transition: opacity .5s;\n    }\n    .hero-hint.gone { opacity: 0 !important; }\n    .hero-hint span {\n      font-size: .62rem; letter-spacing: .1em; text-transform: uppercase;\n      color: var(--text-light); border: 1px solid var(--border);\n      background: rgba(7,17,30,.55); padding: .32rem .65rem; border-radius: 100px;\n      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);\n    }\n    @keyframes hintIn { to { opacity: .9; } }\n    @media (max-width: 760px) { .hero-hint { display: none; } }\n\n    .hero-inner { position: relative; z-index: 3; max-width: 1160px; margin: 0 auto; width: 100%; }\n\n    .hero-badge {\n      display: inline-flex; align-items: center; gap: .55rem;\n      background: rgba(27,117,188,.15); border: 1px solid rgba(27,117,188,.4);\n      color: var(--pg-green); font-size: .76rem; font-weight: 700;\n      letter-spacing: .14em; text-transform: uppercase;\n      padding: .38rem .95rem; border-radius: 100px; margin-bottom: 1.6rem;\n    }\n    .hero-badge::before {\n      content: ''; width: 7px; height: 7px; border-radius: 50%;\n      background: var(--pg-green); animation: blink 2s infinite;\n    }\n    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.6)} }\n\n    h1.hero-title {\n      font-size: clamp(3rem, 7.5vw, 5.5rem); font-weight: 900;\n      line-height: 1.04; letter-spacing: -.025em;\n      color: var(--text-white); margin-bottom: 1.4rem; max-width: 840px;\n    }\n    h1.hero-title em { color: var(--pg-gold); font-style: normal; }\n\n    .hero-sub {\n      font-size: clamp(1rem, 2vw, 1.22rem); line-height: 1.75;\n      color: var(--text-light); max-width: 600px; margin-bottom: 2.5rem;\n    }\n\n    .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 3.8rem; }\n\n    .btn-primary {\n      background: var(--pg-blue); color: #fff;\n      padding: .88rem 2.1rem; border-radius: 5px; font-weight: 800; font-size: 1rem;\n      transition: background .2s, transform .15s, box-shadow .2s;\n      box-shadow: 0 4px 24px rgba(27,117,188,.35);\n    }\n    .btn-primary:hover { background: var(--pg-blue-dark); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(27,117,188,.5); }\n\n    .btn-ghost {\n      background: transparent; color: var(--text-white);\n      padding: .88rem 2.1rem; border-radius: 5px; font-weight: 600; font-size: 1rem;\n      border: 1.5px solid rgba(255,255,255,.22); transition: border-color .2s, color .2s;\n    }\n    .btn-ghost:hover { border-color: var(--pg-blue); color: var(--pg-blue); }\n\n    /* Stat strip */\n    .hero-stats {\n      display: grid; grid-template-columns: repeat(4, 1fr);\n      gap: 1px; background: rgba(255,255,255,.07);\n      border: 1px solid rgba(27,117,188,.2); border-radius: 8px;\n      overflow: hidden; max-width: 820px;\n    }\n    .stat-item {\n      background: rgba(11,26,46,.7); backdrop-filter: blur(8px);\n      padding: 1.2rem 1.5rem; transition: background .2s;\n    }\n    .stat-item:hover { background: rgba(27,117,188,.18); }\n    .stat-val { font-size: 2rem; font-weight: 900; color: var(--pg-blue); line-height: 1; margin-bottom: .3rem; }\n    .stat-label { font-size: .77rem; color: var(--text-muted); line-height: 1.45; }\n\n    /* Scroll cue */\n    .scroll-hint {\n      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);\n      display: flex; flex-direction: column; align-items: center; gap: .45rem;\n      color: var(--text-muted); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;\n      z-index: 3; animation: nudge 2.5s ease-in-out infinite;\n    }\n    .scroll-hint::after { content: ''; width: 1px; height: 36px; background: linear-gradient(to bottom, var(--text-muted), transparent); }\n    @keyframes nudge { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(7px)} }\n\n    /* ── INTRO BAND ─────────────────────────────────────────────────────────── */\n    #intro {\n      background: var(--bg-mid);\n      border-top: 1px solid rgba(27,117,188,.2);\n      border-bottom: 1px solid rgba(27,117,188,.1);\n      padding: 4rem 2rem;\n    }\n    #intro .container { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }\n    .intro-text h2 { font-size: clamp(1.4rem,2.5vw,1.9rem); font-weight: 800; color: var(--text-white); margin-bottom: .75rem; }\n    .intro-text p { font-size: .98rem; line-height: 1.75; color: var(--text-muted); }\n    .intro-pills { display: flex; flex-wrap: wrap; gap: .6rem; }\n    .pill {\n      background: rgba(27,117,188,.12); border: 1px solid rgba(27,117,188,.3);\n      color: var(--text-light); font-size: .79rem; font-weight: 600;\n      padding: .38rem .9rem; border-radius: 100px;\n    }\n\n    /* ── HOW IT WORKS ───────────────────────────────────────────────────────── */\n    #how { padding: 7rem 2rem; background: var(--bg-deep); }\n    #how .section-header { margin-bottom: 3.5rem; }\n\n    .steps {\n      display: grid; grid-template-columns: repeat(4,1fr);\n      gap: 1.5px; background: var(--border); border: 1px solid var(--border);\n      border-radius: 12px; overflow: hidden;\n    }\n    .step {\n      background: var(--bg-deep); padding: 2.5rem 1.8rem;\n      position: relative; transition: background .3s;\n    }\n    .step:hover { background: rgba(27,117,188,.08); }\n    .step-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }\n    .step:nth-child(1) .step-bar { background: var(--pg-blue-deep); }\n    .step:nth-child(2) .step-bar { background: var(--pg-blue); }\n    .step:nth-child(3) .step-bar { background: var(--pg-green); }\n    .step:nth-child(4) .step-bar { background: var(--pg-gold); }\n    .step-num {\n      font-size: 3.8rem; font-weight: 900; line-height: 1;\n      color: rgba(27,117,188,.18); margin-bottom: 1.1rem;\n    }\n    .step-icon {\n      width: 46px; height: 46px; border-radius: 10px;\n      background: rgba(27,117,188,.15); border: 1px solid rgba(27,117,188,.3);\n      display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;\n    }\n    .step-icon svg { width: 23px; height: 23px; fill: none; stroke: var(--pg-blue); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n    .step:nth-child(3) .step-icon { background: rgba(94,172,58,.12); border-color: rgba(94,172,58,.3); }\n    .step:nth-child(3) .step-icon svg { stroke: var(--pg-green); }\n    .step:nth-child(4) .step-icon { background: rgba(245,165,0,.12); border-color: rgba(245,165,0,.3); }\n    .step:nth-child(4) .step-icon svg { stroke: var(--pg-gold); }\n    .step h3 { font-size: 1.05rem; font-weight: 800; color: var(--text-white); margin-bottom: .65rem; }\n    .step p { font-size: .875rem; line-height: 1.72; color: var(--text-muted); }\n\n    /* ── METRICS ────────────────────────────────────────────────────────────── */\n    #metrics {\n      padding: 7rem 2rem;\n      background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-mid) 100%);\n    }\n    .metrics-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-top: 3rem; }\n    .metric-card {\n      background: var(--bg-card); border: 1px solid var(--border);\n      border-radius: 10px; padding: 1.5rem 1.6rem;\n      transition: border-color .3s, background .3s, transform .25s;\n    }\n    .metric-card:hover { border-color: var(--border-bright); background: var(--bg-card-hover); transform: translateY(-3px); }\n    .metric-card-top { display: flex; align-items: center; gap: .7rem; margin-bottom: .55rem; }\n    .metric-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pg-blue); flex-shrink: 0; }\n    .metric-name { font-size: .95rem; font-weight: 800; color: var(--text-white); }\n    .metric-detail { font-size: .84rem; color: var(--text-muted); line-height: 1.65; }\n    .metric-acc { font-size: .75rem; color: var(--pg-green); margin-top: .45rem; font-weight: 600; }\n\n    /* ── JAKARTO ────────────────────────────────────────────────────────────── */\n    #jakarto {\n      padding: 7rem 2rem; background: var(--bg-deep); position: relative; overflow: hidden;\n    }\n    .jk-bg {\n      position: absolute; right: -180px; top: -80px; width: 560px; height: 560px;\n      border-radius: 50%;\n      background: radial-gradient(circle, rgba(27,117,188,.18) 0%, transparent 65%);\n      pointer-events: none;\n    }\n    #jakarto .container { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start; position: relative; z-index: 2; }\n    .jakarto-specs { display: flex; flex-direction: column; gap: .8rem; }\n    .spec-row {\n      display: flex; align-items: center; gap: 1.2rem;\n      background: var(--bg-card); border: 1px solid var(--border);\n      border-radius: 8px; padding: 1rem 1.4rem;\n      transition: background .2s, border-color .2s;\n    }\n    .spec-row:hover { background: var(--bg-card-hover); border-color: var(--border-bright); }\n    .spec-val { font-size: 1.6rem; font-weight: 900; color: var(--pg-blue); min-width: 92px; flex-shrink: 0; }\n    .spec-desc { font-size: .875rem; color: var(--text-muted); line-height: 1.5; }\n    .spec-desc strong { color: var(--text-light); display: block; font-size: .9rem; margin-bottom: .1rem; }\n    .partner-badge {\n      display: inline-flex; align-items: center; gap: .55rem;\n      background: rgba(245,165,0,.1); border: 1px solid rgba(245,165,0,.3);\n      padding: .5rem 1.1rem; border-radius: 6px; margin-top: 1.3rem;\n      font-size: .8rem; color: var(--pg-gold); font-weight: 700;\n    }\n\n    /* ── USE CASES ──────────────────────────────────────────────────────────── */\n    #usecases {\n      padding: 7rem 2rem;\n      background: linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-dark) 100%);\n    }\n    .usecase-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; margin-top: 3rem; }\n    .usecase-card {\n      background: var(--bg-card); border: 1px solid var(--border);\n      border-radius: 12px; padding: 2rem 1.8rem; position: relative; overflow: hidden;\n      transition: transform .3s, border-color .3s;\n    }\n    .usecase-card:hover { transform: translateY(-5px); border-color: var(--border-bright); }\n    .usecase-card::before {\n      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;\n    }\n    .usecase-card:nth-child(1)::before { background: linear-gradient(90deg, var(--pg-blue), var(--pg-green)); }\n    .usecase-card:nth-child(2)::before { background: linear-gradient(90deg, var(--pg-green), var(--pg-gold)); }\n    .usecase-card:nth-child(3)::before { background: linear-gradient(90deg, var(--pg-gold), var(--pg-blue)); }\n    .usecase-icon {\n      width: 54px; height: 54px; border-radius: 12px;\n      background: rgba(27,117,188,.12); border: 1px solid rgba(27,117,188,.25);\n      display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem;\n    }\n    .usecase-icon svg { width: 26px; height: 26px; fill: none; stroke: var(--pg-blue); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n    .usecase-card h3 { font-size: 1.1rem; font-weight: 800; color: var(--text-white); margin-bottom: .5rem; }\n    .usecase-card p { font-size: .875rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 1rem; }\n    .usecase-list { list-style: none; display: flex; flex-direction: column; gap: .38rem; }\n    .usecase-list li { font-size: .82rem; color: var(--text-muted); padding-left: 1rem; position: relative; }\n    .usecase-list li::before {\n      content: ''; position: absolute; left: 0; top: .42em;\n      width: 5px; height: 5px; border-radius: 50%; background: var(--pg-green);\n    }\n\n    /* ── CTA ────────────────────────────────────────────────────────────────── */\n    #cta {\n      padding: 8rem 2rem; text-align: center; position: relative; overflow: hidden;\n      background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 100%);\n    }\n    .cta-glow {\n      position: absolute; inset: 0; pointer-events: none;\n      background: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(27,117,188,.2) 0%, transparent 65%);\n    }\n    #cta .container { position: relative; z-index: 2; }\n    #cta h2 {\n      font-size: clamp(2.2rem,5vw,3.6rem); font-weight: 900;\n      color: var(--text-white); margin-bottom: 1rem; max-width: 720px; margin-inline: auto;\n    }\n    #cta h2 em { color: var(--pg-gold); font-style: normal; }\n    #cta > .container > p {\n      font-size: 1.05rem; color: var(--text-muted); max-width: 520px;\n      margin: 0 auto 2.8rem; line-height: 1.75;\n    }\n    .cta-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }\n    .btn-large { padding: 1rem 2.4rem; font-size: 1.05rem; font-weight: 800; border-radius: 6px; transition: all .2s; }\n    .btn-green { background: var(--pg-green); color: #fff; box-shadow: 0 4px 20px rgba(94,172,58,.3); }\n    .btn-green:hover { background: var(--pg-green-dark); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(94,172,58,.4); }\n\n    .cta-form { display: flex; gap: .6rem; max-width: 440px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }\n    .cta-input {\n      flex: 1; min-width: 195px;\n      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);\n      color: var(--text-white); padding: .82rem 1.1rem; border-radius: 5px;\n      font-size: .95rem; outline: none; transition: border-color .2s;\n    }\n    .cta-input:focus { border-color: var(--pg-blue); }\n    .cta-input::placeholder { color: var(--text-muted); }\n    .cta-submit {\n      background: var(--pg-blue); color: #fff; padding: .82rem 1.6rem;\n      border: none; border-radius: 5px; font-size: .95rem; font-weight: 800;\n      cursor: pointer; transition: background .2s, transform .15s;\n    }\n    .cta-submit:hover { background: var(--pg-blue-dark); transform: translateY(-1px); }\n    .cta-note { font-size: .77rem; color: var(--text-muted); margin-top: .8rem; }\n\n    /* ── FOOTER ─────────────────────────────────────────────────────────────── */\n    footer {\n      background: var(--bg-deep); border-top: 1px solid var(--border); padding: 2.2rem 2rem;\n    }\n    footer .container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }\n    .footer-logo img { height: 28px; opacity: .85; }\n    .footer-links { display: flex; gap: 1.8rem; }\n    .footer-links a { font-size: .82rem; color: var(--text-muted); transition: color .2s; }\n    .footer-links a:hover { color: var(--text-white); }\n    .footer-copy { font-size: .78rem; color: var(--text-muted); }\n\n    /* ── RESPONSIVE ─────────────────────────────────────────────────────────── */\n    @media (max-width: 920px) {\n      .steps { grid-template-columns: 1fr 1fr; }\n      .metrics-grid { grid-template-columns: 1fr 1fr; }\n      .usecase-grid { grid-template-columns: 1fr; }\n      #intro .container, #jakarto .container { grid-template-columns: 1fr; gap: 2.5rem; }\n      .hero-stats { grid-template-columns: repeat(2,1fr); max-width: 440px; }\n      .nav-links { display: none; }\n    }\n    @media (max-width: 560px) {\n      .steps { grid-template-columns: 1fr; }\n      .metrics-grid { grid-template-columns: 1fr; }\n      .hero-stats { grid-template-columns: 1fr 1fr; }\n    }\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ── NAV ──────────────────────────────────────────────────────────────────── -->\n<nav>\n  <div class=\"nav-logo\">\n    <a href=\"https://planitgeo.com\" target=\"_blank\">\n      <img src=\"5393170c-7d02-43f0-af95-51ad6ce985d8\" alt=\"PlanIT Geo™\">\n    <\u002Fa>\n  <\u002Fdiv>\n  <ul class=\"nav-links\">\n    <li><a href=\"#how\">How It Works<\u002Fa><\u002Fli>\n    <li><a href=\"#metrics\">Data Outputs<\u002Fa><\u002Fli>\n    <li><a href=\"#jakarto\">Technology<\u002Fa><\u002Fli>\n    <li><a href=\"#usecases\">Use Cases<\u002Fa><\u002Fli>\n    <li><a href=\"#cta\" class=\"nav-cta\">Request a Demo<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- ── HERO ─────────────────────────────────────────────────────────────────── -->\n<section id=\"hero\">\n  <div class=\"orb orb-1\"><\u002Fdiv>\n  <div class=\"orb orb-2\"><\u002Fdiv>\n  <div class=\"orb orb-3\"><\u002Fdiv>\n  <canvas id=\"lidar-canvas\"><\u002Fcanvas>\n  <div class=\"hero-haze\"><\u002Fdiv>\n  <div class=\"hero-grid\"><\u002Fdiv>\n  <div class=\"hero-scrim\"><\u002Fdiv>\n\n  <div class=\"hero-inner\">\n    <div class=\"hero-badge reveal\">TreeD™ Hybrid Tree Inventory — Now Available<\u002Fdiv>\n\n    <h1 class=\"hero-title reveal d1\">\n      Your city's trees,<br>\n      mapped in <em>3D<\u002Fem>.<br>\n      Every single one.\n    <\u002Fh1>\n\n    <p class=\"hero-sub reveal d2\">\n      TreeD™ fuses military-grade mobile LiDAR, AI-powered automation, and ISA Certified Arborist expertise to deliver the most complete, current, and actionable urban tree inventory ever built — at citywide scale, in weeks.\n    <\u002Fp>\n\n    <div class=\"hero-actions reveal d3\">\n      <a href=\"#cta\" class=\"btn-primary btn-large\">Request a Free Demo<\u002Fa>\n      <a href=\"#how\" class=\"btn-ghost btn-large\">See How It Works ↓<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"hero-stats reveal d4\">\n      <div class=\"stat-item\">\n        <div class=\"stat-val\" data-prefix=\"60–\" data-count=\"80\" data-suffix=\"%\">60–80%<\u002Fdiv>\n        <div class=\"stat-label\">Faster than traditional field-only inventory<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-item\">\n        <div class=\"stat-val\" data-prefix=\"&lt;\" data-count=\"5\" data-suffix=\" cm\">&lt;5 cm<\u002Fdiv>\n        <div class=\"stat-label\">GPS positional accuracy per tree<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-item\">\n        <div class=\"stat-val\" data-count=\"2\" data-suffix=\"M+\">2M+<\u002Fdiv>\n        <div class=\"stat-label\">Laser pulses captured per second<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-item\">\n        <div class=\"stat-val\" data-count=\"100\" data-suffix=\"%\">100%<\u002Fdiv>\n        <div class=\"stat-label\">Right-of-way coverage in a single pass<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"scroll-hint\">Explore<\u002Fdiv>\n  <div class=\"hero-hint\" id=\"heroHint\">\n    <span>Drag to look<\u002Fspan>\n    <span>Move to scan<\u002Fspan>\n    <span>Click to pulse<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── INTRO BAND ────────────────────────────────────────────────────────────── -->\n<section id=\"intro\">\n  <div class=\"container\">\n    <div class=\"intro-text reveal\">\n      <h2>Urban forestry data has never looked like this.<\u002Fh2>\n      <p>Most inventories are out-of-date before the ink dries. TreeD™ changes the equation — combining the speed of autonomous LiDAR with certified arborist precision, delivered into TreePlotter™ as a living system of record your whole organization can act on.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"reveal d2\">\n      <p style=\"font-size:.78rem;color:var(--pg-green);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.9rem;\">Four integrated pillars<\u002Fp>\n      <div class=\"intro-pills\">\n        <span class=\"pill\">Mobile LiDAR<\u002Fspan>\n        <span class=\"pill\">AI Automation<\u002Fspan>\n        <span class=\"pill\">ISA Certified Arborists<\u002Fspan>\n        <span class=\"pill\">TreePlotter™ Integration<\u002Fspan>\n        <span class=\"pill\">Jakarto Partnership<\u002Fspan>\n        <span class=\"pill\">U.S. &amp; Canada<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── HOW IT WORKS ──────────────────────────────────────────────────────────── -->\n<section id=\"how\">\n  <div class=\"container\">\n    <div class=\"section-header\">\n      <p class=\"section-label reveal\">The Methodology<\u002Fp>\n      <h2 class=\"section-title reveal d1\">Four steps. One complete inventory.<\u002Fh2>\n      <p class=\"section-sub reveal d2\">A continuous, update-ready workflow. Every phase builds on the last — and the cycle repeats every time you need fresh data, without rebuilding from scratch.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"steps\">\n      <!-- Step 1 -->\n      <div class=\"step reveal\">\n        <div class=\"step-bar\"><\u002Fdiv>\n        <div class=\"step-num\">01<\u002Fdiv>\n        <div class=\"step-icon\">\n          <svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1\" style=\"fill:var(--pg-blue)\"><\u002Fcircle><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"1\"><\u002Fline><line x1=\"12\" y1=\"21\" x2=\"12\" y2=\"23\"><\u002Fline><line x1=\"3\" y1=\"12\" x2=\"1\" y2=\"12\"><\u002Fline><line x1=\"21\" y1=\"12\" x2=\"23\" y2=\"12\"><\u002Fline><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>LiDAR Scanning<\u002Fh3>\n        <p>Jakarto-powered vehicles sweep your city at traffic speed — 2 million laser pulses per second, synchronized 72 MP 360° cameras, sub-5cm accuracy. Complete right-of-way coverage in days, not months.<\u002Fp>\n      <\u002Fdiv>\n      <!-- Step 2 -->\n      <div class=\"step reveal d1\">\n        <div class=\"step-bar\"><\u002Fdiv>\n        <div class=\"step-num\">02<\u002Fdiv>\n        <div class=\"step-icon\">\n          <svg viewBox=\"0 0 24 24\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"><\u002Frect><line x1=\"9\" y1=\"3\" x2=\"9\" y2=\"6\"><\u002Fline><line x1=\"15\" y1=\"3\" x2=\"15\" y2=\"6\"><\u002Fline><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"21\"><\u002Fline><line x1=\"15\" y1=\"18\" x2=\"15\" y2=\"21\"><\u002Fline><line x1=\"3\" y1=\"9\" x2=\"6\" y2=\"9\"><\u002Fline><line x1=\"3\" y1=\"15\" x2=\"6\" y2=\"15\"><\u002Fline><line x1=\"18\" y1=\"9\" x2=\"21\" y2=\"9\"><\u002Fline><line x1=\"18\" y1=\"15\" x2=\"21\" y2=\"15\"><\u002Fline><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>AI Automation<\u002Fh3>\n        <p>Proprietary algorithms transform the point cloud into a complete baseline inventory in days. Every tree detected, located, and measured — DBH, height, crown volume, clearances. Consistent. Objective. Exhaustive.<\u002Fp>\n      <\u002Fdiv>\n      <!-- Step 3 -->\n      <div class=\"step reveal d2\">\n        <div class=\"step-bar\"><\u002Fdiv>\n        <div class=\"step-num\">03<\u002Fdiv>\n        <div class=\"step-icon\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Arborist Expertise<\u002Fh3>\n        <p>ISA Certified Arborists review every record remotely — validating species, assessing crown condition, flagging maintenance priorities, and identifying trees requiring on-site formal risk assessment.<\u002Fp>\n      <\u002Fdiv>\n      <!-- Step 4 -->\n      <div class=\"step reveal d3\">\n        <div class=\"step-bar\"><\u002Fdiv>\n        <div class=\"step-num\">04<\u002Fdiv>\n        <div class=\"step-icon\">\n          <svg viewBox=\"0 0 24 24\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>TreePlotter™ Integration<\u002Fh3>\n        <p>Validated data flows into TreePlotter — your living urban forest command center. Work orders, inspections, reporting, planning. Re-scan. Refresh. Repeat. Forever current, never rebuilt from scratch.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── METRICS ───────────────────────────────────────────────────────────────── -->\n<section id=\"metrics\">\n  <div class=\"container\">\n    <div class=\"section-header\">\n      <p class=\"section-label reveal\">Data Outputs<\u002Fp>\n      <h2 class=\"section-title reveal d1\">Every tree. Every metric.<br>No guesswork.<\u002Fh2>\n      <p class=\"section-sub reveal d2\">A complete, defensible digital portrait of every tree in your urban forest — attributes consistent across every block, district, and city in your program.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"metrics-grid\">\n      <div class=\"metric-card reveal\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Tree Location<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">Sub-centimeter GPS-registered X/Y coordinate, street address, and parcel association for every tree.<\u002Fdiv>\n        <div class=\"metric-acc\">Sub-5cm accuracy · 90% of measurements<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal d1\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Diameter (DBH)<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">Trunk diameter at breast height measured directly from the point cloud using trunk-fitting algorithms.<\u002Fdiv>\n        <div class=\"metric-acc\">Typical accuracy: ±1–2 cm · R² &gt; 0.93 vs. manual<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal d2\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Tree Height<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">Total height, height to crown base, and clearance height — all derived from direct LiDAR measurement.<\u002Fdiv>\n        <div class=\"metric-acc\">Typical accuracy: ±0.3 m<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal d1\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Crown Dimensions<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">N–S and E–W spread, maximum crown spread, estimated 3D crown volume, and canopy density index.<\u002Fdiv>\n        <div class=\"metric-acc\">Derived from 3D canopy point returns<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal d2\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Utility Clearances<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">Precise 3D measurement of vertical and horizontal clearances to overhead lines, cables, signs, and buildings.<\u002Fdiv>\n        <div class=\"metric-acc\">Direct measurement from point cloud geometry<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal d3\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Planting Sites<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">Available vs. occupied planting locations, pit dimensions, soil or pavement type, and site constraints.<\u002Fdiv>\n        <div class=\"metric-acc\">Street imagery + point cloud fusion<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Species Identification<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">ISA Arborist-validated genus and species from bark texture, canopy form, and branching in 72 MP imagery.<\u002Fdiv>\n        <div class=\"metric-acc\">85–92% genus-level accuracy; field verification for flagged records<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal d1\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Condition &amp; Risk Flags<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">Crown condition ratings (ISA scale), visible structural concerns, maintenance priority codes, and field referral flags.<\u002Fdiv>\n        <div class=\"metric-acc\">Remote ISA review · On-site referrals per TRAQ guidance<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-card reveal d2\">\n        <div class=\"metric-card-top\"><div class=\"metric-dot\"><\u002Fdiv><div class=\"metric-name\">Ecosystem Services<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-detail\">CO&amp;sub2; storage, annual sequestration, stormwater interception, energy savings, and canopy contribution via i-Tree in TreePlotter.<\u002Fdiv>\n        <div class=\"metric-acc\">Powered by i-Tree · USDA Forest Service methodology<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── JAKARTO PARTNERSHIP ────────────────────────────────────────────────────── -->\n<section id=\"jakarto\">\n  <div class=\"jk-bg\"><\u002Fdiv>\n  <div class=\"container\">\n\n    <div class=\"reveal\">\n      <p class=\"section-label\">Technology Partner<\u002Fp>\n      <h2 class=\"section-title\">Powered by the most advanced<br>mobile LiDAR on the continent.<\u002Fh2>\n      <p class=\"section-sub\" style=\"margin-bottom:1.4rem;\">\n        TreeD™ is built on an exclusive strategic partnership with Jakarto — North America's leading large-scale mobile LiDAR mapping company. This isn't a vendor relationship. Jakarto's capture precision is inseparable from PlanIT Geo's urban forestry methodology.\n      <\u002Fp>\n      <div class=\"partner-badge\">\n        ★ &nbsp;Exclusive PlanIT Geo × Jakarto Partnership\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"jakarto-specs\">\n      <div class=\"spec-row reveal\">\n        <div class=\"spec-val\" data-count=\"2\" data-suffix=\"M\">2M<\u002Fdiv>\n        <div class=\"spec-desc\"><strong>Laser pulses per second<\u002Fstrong>Dense wall-to-wall 3D coverage of every trunk, branch, and canopy layer in the right-of-way<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row reveal d1\">\n        <div class=\"spec-val\" data-prefix=\"&lt;\" data-count=\"5\" data-suffix=\"cm\">&lt;5cm<\u002Fdiv>\n        <div class=\"spec-desc\"><strong>GIS positional accuracy<\u002Fstrong>Sub-5cm in 90% of measurements — meets engineering-grade asset mapping standards<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row reveal d2\">\n        <div class=\"spec-val\" data-count=\"72\" data-suffix=\" MP\">72 MP<\u002Fdiv>\n        <div class=\"spec-desc\"><strong>360° Ladybug6 camera system<\u002Fstrong>Full-sphere imagery synchronized with LiDAR for species ID and condition review<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row reveal d3\">\n        <div class=\"spec-val\" data-count=\"150\" data-suffix=\"K+\">150K+<\u002Fdiv>\n        <div class=\"spec-desc\"><strong>Kilometers already mapped<\u002Fstrong>Proven at scale across 150+ cities in North America — no learning curve on your project<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec-row reveal d4\">\n        <div class=\"spec-val\" data-count=\"48\" data-suffix=\" hr\">48 hr<\u002Fdiv>\n        <div class=\"spec-desc\"><strong>Data delivery turnaround<\u002Fstrong>Point cloud and imagery available online within 48 hours of field capture completion<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── USE CASES ─────────────────────────────────────────────────────────────── -->\n<section id=\"usecases\">\n  <div class=\"container\">\n    <div class=\"section-header\">\n      <p class=\"section-label reveal\">Who We Serve<\u002Fp>\n      <h2 class=\"section-title reveal d1\">Built for every scale of urban forestry.<\u002Fh2>\n      <p class=\"section-sub reveal d2\">One scan. Infinite applications. The same LiDAR dataset that produces your tree inventory simultaneously serves Forestry, Utilities, Transportation, and Planning.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"usecase-grid\">\n      <div class=\"usecase-card reveal\">\n        <div class=\"usecase-icon\">\n          <svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"><\u002Frect><rect x=\"10\" y=\"3\" width=\"4\" height=\"18\" rx=\"1\"><\u002Frect><rect x=\"18\" y=\"10\" width=\"4\" height=\"11\" rx=\"1\"><\u002Frect><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Cities &amp; Municipalities<\u002Fh3>\n        <p>Complete citywide inventories in weeks. Turn your urban forest from a liability into a data-driven, grant-winning, climate-resilient asset.<\u002Fp>\n        <ul class=\"usecase-list\">\n          <li>Complete street tree coverage in a single mobilization<\u002Fli>\n          <li>Equity mapping &amp; canopy gap analysis<\u002Fli>\n          <li>USFS Urban &amp; Community Forestry grant compliance<\u002Fli>\n          <li>Stormwater, heat island &amp; carbon reporting<\u002Fli>\n          <li>Cross-department sharing via TreePlotter™<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"usecase-card reveal d1\">\n        <div class=\"usecase-icon\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z\"><\u002Fpath><line x1=\"9\" y1=\"3\" x2=\"9\" y2=\"18\"><\u002Fline><line x1=\"15\" y1=\"6\" x2=\"15\" y2=\"21\"><\u002Fline><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Counties &amp; State Agencies<\u002Fh3>\n        <p>Statewide programs that were previously impractical are now achievable. Standardize inventory data across every jurisdiction you oversee.<\u002Fp>\n        <ul class=\"usecase-list\">\n          <li>Statewide inventory at unprecedented speed and scale<\u002Fli>\n          <li>Standardized schema across all municipalities<\u002Fli>\n          <li>State forest action plan &amp; canopy goal reporting<\u002Fli>\n          <li>Multi-agency cost-sharing arrangements<\u002Fli>\n          <li>Climate resilience planning datasets<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"usecase-card reveal d2\">\n        <div class=\"usecase-icon\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M13 2L3 14h9l-1 8 10-12h-9l1-8z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Utilities &amp; Transportation<\u002Fh3>\n        <p>The same scan that inventories trees maps every vegetation conflict with your infrastructure — at centimeter precision, city-wide.<\u002Fp>\n        <ul class=\"usecase-list\">\n          <li>Vegetation-line clearance mapping in 3D<\u002Fli>\n          <li>ROW conflict detection: trees vs. infrastructure<\u002Fli>\n          <li>Proactive risk reduction before outage events<\u002Fli>\n          <li>Cost-shared scanning with municipal partners<\u002Fli>\n          <li>Repeatable annual monitoring workflows<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── CTA ───────────────────────────────────────────────────────────────────── -->\n<section id=\"cta\">\n  <div class=\"cta-glow\"><\u002Fdiv>\n  <div class=\"container\">\n    <p class=\"section-label reveal\" style=\"text-align:center;\">Get Started Today<\u002Fp>\n    <h2 class=\"reveal d1\">Your urban forest<br>can't <em>wait<\u002Fem>.<\u002Fh2>\n    <p class=\"reveal d2\">Every day without accurate data is a missed opportunity — to reduce risk, unlock funding, build climate resilience, and serve your community. TreeD™ changes that, starting now.<\u002Fp>\n\n    <div class=\"cta-actions reveal d3\">\n      <a href=\"https://marketing.planitgeo.com/planit-geo-contact-us-and-demo\" target=\"_blank\" class=\"btn-primary btn-large\">Request a Free Demo<\u002Fa>\n      <a href=\"https://planitgeo.com/treed-hybrid-tree-inventory/\" target=\"_blank\" class=\"btn-ghost btn-large\">Explore TreeD™ at planitgeo.com<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"reveal d4\">\n      <div class=\"cta-form\">\n        <input class=\"cta-input\" type=\"email\" placeholder=\"Your work email address\">\n        <button class=\"cta-submit\" onclick=\"handleSubmit(this)\">Get in Touch<\u002Fbutton>\n      <\u002Fdiv>\n      <p class=\"cta-note\">A PlanIT Geo urban forestry specialist will respond within one business day. No spam, ever.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── FOOTER ────────────────────────────────────────────────────────────────── -->\n<footer>\n  <div class=\"container\">\n    <div class=\"footer-logo\">\n      <a href=\"https://planitgeo.com\" target=\"_blank\">\n        <img src=\"5393170c-7d02-43f0-af95-51ad6ce985d8\" alt=\"PlanIT Geo™\">\n      <\u002Fa>\n    <\u002Fdiv>\n    <div class=\"footer-links\">\n      <a href=\"https://planitgeo.com/treed-hybrid-tree-inventory/\" target=\"_blank\">TreeD™<\u002Fa>\n      <a href=\"https://planitgeo.com/treeplotter/\" target=\"_blank\">TreePlotter™<\u002Fa>\n      <a href=\"https://planitgeo.com/urban-forestry-resource-library/\" target=\"_blank\">Resources<\u002Fa>\n      <a href=\"https://marketing.planitgeo.com/planit-geo-contact-us-and-demo\" target=\"_blank\">Contact<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"footer-copy\">© 2026 PlanIT Geo™ &nbsp;·&nbsp; 833-873-3627 &nbsp;·&nbsp; Wheat Ridge, CO<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Scroll reveal\n  const obs = new IntersectionObserver(entries => {\n    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });\n  }, { threshold: 0.1 });\n  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));\n\n  // Fallback: guarantee above-the-fold reveals appear even if IO delivery is delayed\n  function revealInView() {\n    document.querySelectorAll('.reveal:not(.visible)').forEach(el => {\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.95) el.classList.add('visible');\n    });\n  }\n  window.addEventListener('load', () => setTimeout(revealInView, 350));\n  setTimeout(revealInView, 1200);\n\n  // Sticky nav bg\n  window.addEventListener('scroll', () => {\n    document.querySelector('nav').style.background =\n      window.scrollY > 50 ? 'rgba(7,17,30,1)' : 'rgba(7,17,30,.95)';\n  });\n\n  // Smooth scroll\n  document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n    a.addEventListener('click', e => {\n      e.preventDefault();\n      const t = document.querySelector(a.getAttribute('href'));\n      if (t) t.scrollIntoView({ behavior: 'smooth' });\n    });\n  });\n\n  /* ════════════════════════════════════════════════════════════════════════\n     LiDAR STREET SWEEP — canvas point-cloud hero\n     A perspective point cloud of a city street (road, sidewalk trees, building\n     facades). A glowing scan front sweeps from the horizon toward the viewer,\n     igniting points into brand colours as the urban forest is \"captured\".\n     Reactive parallax follows the cursor; auto-drifts when idle.\n  ════════════════════════════════════════════════════════════════════════ */\n  (function () {\n    const canvas = document.getElementById('lidar-canvas');\n    if (!canvas) return;\n    const ctx = canvas.getContext('2d', { alpha: true });\n    const hero = document.getElementById('hero');\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n    // ── colours ──\n    const C = {\n      ground:   [44, 104, 158],\n      tree:     [94, 172, 58],\n      treeAlt:  [120, 188, 70],\n      building: [58, 116, 168],\n      hot:      [255, 224, 158],   // warm scan-front glow\n      hotCore:  [255, 248, 232],\n    };\n\n    // ── feature trees — interactive inventory tags (all on the open right side) ──\n    const FEATURES = [\n      { x: 6.2, z: 20, scale: 1.28, id: 'TREE #10428', sp: 'Quercus rubra',          cm: 'Northern Red Oak', h: '14.2 m', dbh: '47 cm', cond: 'Good' },\n      { x: 6.7, z: 33, scale: 1.02, id: 'TREE #10591', sp: 'Acer platanoides',        cm: 'Norway Maple',     h: '11.8 m', dbh: '38 cm', cond: 'Fair' },\n      { x: 7.1, z: 49, scale: 1.12, id: 'TREE #10733', sp: 'Gleditsia triacanthos',   cm: 'Honeylocust',      h: '9.6 m',  dbh: '29 cm', cond: 'Good' },\n    ];\n\n    // ── world / camera ──\n    const Z_NEAR = 4.2, Z_FAR = 132;\n    const GROUND_Y = 1.55;          // camera eye-height above road\n    let W = 0, H = 0, dpr = 1, f = 1, cx = 0, cy = 0;\n\n    function rand(a, b) { return a + Math.random() * (b - a); }\n\n    // ── build geometry ──\n    const pts = [];\n    function P(x, y, z, color, size) { pts.push({ x, y, z, c: color, s: size, lit: 0 }); }\n\n    // Road surface — dense LiDAR scatter, biased denser near camera\n    for (let i = 0; i < 760; i++) {\n      const z = Z_NEAR + Math.pow(Math.random(), 1.7) * (Z_FAR - Z_NEAR);\n      const x = rand(-8.5, 8.5);\n      // sidewalk strips slightly raised\n      const curb = Math.abs(x) > 6 ? -0.12 : 0;\n      P(x, GROUND_Y + curb + rand(-0.04, 0.04), z, C.ground, rand(0.018, 0.032));\n    }\n    // Lane / centre-line markers (gold dashes) for road read\n    for (let z = Z_NEAR + 3; z < Z_FAR; z += 3.4) {\n      P(rand(-0.25, 0.25), GROUND_Y - 0.02, z + rand(-0.3, 0.3), C.hot, 0.05);\n    }\n\n    // Street trees along both sidewalks\n    function tree(x, z, scale, green) {\n      const topY = GROUND_Y - 5.2 * scale;\n      // trunk\n      for (let i = 0; i < 7; i++)\n        P(x + rand(-0.06, 0.06), GROUND_Y - i * 0.55 * scale, z + rand(-0.06, 0.06), C.building, 0.026);\n      // crown — clustered sphere\n      const n = 48 + Math.floor(20 * scale);\n      const r = 2.5 * scale;\n      for (let i = 0; i < n; i++) {\n        const u = Math.random(), v = Math.random();\n        const th = u * Math.PI * 2, ph = Math.acos(2 * v - 1);\n        const rr = r * Math.pow(Math.random(), 0.45);\n        P(x + rr * Math.sin(ph) * Math.cos(th),\n          topY + rr * Math.cos(ph) * 0.92,\n          z + rr * Math.sin(ph) * Math.sin(th),\n          green, rand(0.03, 0.055));\n      }\n    }\n    let tz = Z_NEAR + 5;\n    let alt = false;\n    while (tz < Z_FAR) {\n      const sc = rand(0.85, 1.25);\n      tree(rand(6.0, 6.8),  tz + rand(-0.8, 0.8), sc, alt ? C.treeAlt : C.tree);\n      tree(rand(-6.8, -6.0), tz + rand(-2, 2),   rand(0.85, 1.25), alt ? C.tree : C.treeAlt);\n      tz += rand(7.5, 10.5);\n      alt = !alt;\n    }\n\n    // Building facades — sparse vertical point walls behind the trees\n    function facade(side) {\n      let z = Z_NEAR + rand(2, 8);\n      while (z < Z_FAR) {\n        const depth = rand(6, 11);\n        const h = rand(7, 22);\n        const x0 = side * rand(12, 16);\n        const cols = 5, rows = Math.max(5, Math.floor(h * 1.1));\n        for (let r = 0; r < rows; r++) {\n          for (let c = 0; c < cols; c++) {\n            if (Math.random() < 0.34) continue; // gaps = windows/sky\n            P(x0 + side * rand(-0.3, 0.3),\n              GROUND_Y - 0.4 - (r / rows) * h,\n              z + (c / cols) * depth + rand(-0.15, 0.15),\n              C.building, rand(0.02, 0.04));\n          }\n        }\n        z += depth + rand(2.5, 6);\n      }\n    }\n    facade(1); facade(-1);\n\n    // feature trees + their floating inventory tags\n    FEATURES.forEach((ft) => {\n      tree(ft.x, ft.z, ft.scale, C.tree);\n      ft.topY = GROUND_Y - 5.2 * ft.scale;\n    });\n    const tagEls = FEATURES.map((ft) => {\n      const d = document.createElement('div');\n      d.className = 'td-tag';\n      d.innerHTML =\n        '<div class=\"td-card\">' +\n          '<div class=\"tdt-id\">' + ft.id + '<\u002Fdiv>' +\n          '<div class=\"tdt-species\">' + ft.sp + '<\u002Fdiv>' +\n          '<div class=\"tdt-common\">' + ft.cm + '<\u002Fdiv>' +\n          '<div class=\"tdt-rows\"><span>HT&nbsp;<b>' + ft.h + '<\u002Fb><\u002Fspan><span>DBH&nbsp;<b>' + ft.dbh + '<\u002Fb><\u002Fspan><span class=\"tdt-cond\">' + ft.cond + '<\u002Fspan><\u002Fdiv>' +\n        '<\u002Fdiv>';\n      hero.appendChild(d);\n      return d;\n    });\n\n    // far → near draw order so nearer points paint on top\n    pts.sort((a, b) => b.z - a.z);\n\n    // ── sizing ──\n    function resize() {\n      const r = hero.getBoundingClientRect();\n      W = r.width; H = r.height;\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      canvas.width = Math.round(W * dpr);\n      canvas.height = Math.round(H * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      f = H * 0.86;\n      cx = W * (W < 760 ? 0.5 : 0.62);\n      cy = H * 0.46;\n    }\n    resize();\n    window.addEventListener('resize', resize);\n\n    // ── interaction state ──\n    let mx = 0, my = 0, yaw = 0, pitch = 0;\n    let curX = -999, curY = -999, curOn = false;\n    let dragging = false, lastPX = 0, lastPY = 0, dragMoved = 0;\n    let dragYaw = 0, dragPitch = 0, velY = 0, velP = 0;\n    let dolly = 0, dollyE = 0;\n    const pulses = [];\n    const hint = document.getElementById('heroHint');\n    const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));\n\n    function setCursor(e) {\n      const r = hero.getBoundingClientRect();\n      curX = e.clientX - r.left; curY = e.clientY - r.top; curOn = true;\n      mx = (e.clientX / window.innerWidth) - 0.5;\n      my = (e.clientY / window.innerHeight) - 0.5;\n    }\n    hero.addEventListener('pointermove', (e) => {\n      setCursor(e);\n      if (dragging) {\n        const dx = e.clientX - lastPX, dy = e.clientY - lastPY;\n        lastPX = e.clientX; lastPY = e.clientY;\n        dragMoved += Math.abs(dx) + Math.abs(dy);\n        velY = -dx * 0.0017; velP = dy * 0.0011;\n        dragYaw = clamp(dragYaw + velY, -0.78, 0.78);\n        dragPitch = clamp(dragPitch + velP, -0.34, 0.34);\n      }\n    }, { passive: true });\n    hero.addEventListener('pointerleave', () => { curOn = false; });\n    hero.addEventListener('pointerdown', (e) => {\n      if (e.target.closest('a, button, input, .td-tag')) return;\n      dragging = true; dragMoved = 0; lastPX = e.clientX; lastPY = e.clientY;\n      velY = 0; velP = 0;\n      hero.classList.add('td-grabbing');\n      if (hint) hint.classList.add('gone');\n      try { hero.setPointerCapture(e.pointerId); } catch (_) {}\n    });\n    window.addEventListener('pointerup', () => {\n      if (!dragging) return;\n      dragging = false;\n      hero.classList.remove('td-grabbing');\n      if (dragMoved < 6 && curOn) pulses.push({ x: curX, y: curY, t: 0 });\n    });\n    window.addEventListener('scroll', () => {\n      dolly = clamp(window.scrollY / (H * 0.85), 0, 1) * 7;\n    }, { passive: true });\n\n    // ── scan state ──\n    let scanZ = Z_FAR, minReached = Z_FAR, firstPass = true;\n    const SPAN = Z_FAR - Z_NEAR;\n    let last = performance.now();\n    const glow = [];\n    const TORCH = 165;\n\n    function project(wx, wy, wz, cyaw, syaw, cpit, spit) {\n      const z0 = wz - dollyE;\n      const xz = wx * cyaw + z0 * syaw;\n      const zz = -wx * syaw + z0 * cyaw;\n      const yy = wy * cpit - zz * spit;\n      const zf = wy * spit + zz * cpit;\n      if (zf < 1.4) return null;\n      const sc = f / zf;\n      return { sx: cx + xz * sc, sy: cy + yy * sc, sc, zf };\n    }\n\n    function frame(now) {\n      const dt = Math.min(50, now - last) / 1000; last = now;\n\n      // animate scan front far → near, then loop\n      scanZ -= SPAN * dt * 0.34;\n      if (scanZ <= Z_NEAR - 4) { scanZ = Z_FAR; }\n      if (firstPass) {\n        minReached = Math.min(minReached, scanZ);\n        if (minReached <= Z_NEAR) firstPass = false;\n      }\n\n      // drag inertia + slow return to rest\n      if (!dragging) {\n        dragYaw += velY; dragPitch += velP;\n        velY *= 0.92; velP *= 0.92;\n        dragYaw *= 0.975; dragPitch *= 0.975;\n      }\n      dollyE += (dolly - dollyE) * 0.08;\n\n      // advance click pulses\n      for (let i = pulses.length - 1; i >= 0; i--) {\n        pulses[i].t += dt;\n        if (pulses[i].t * 720 > Math.hypot(W, H) * 1.15) pulses.splice(i, 1);\n      }\n\n      // ease camera (auto drift + cursor parallax + drag)\n      const auto = Math.sin(now * 0.00018) * 0.055;\n      yaw   += ((mx * 0.16 + auto + dragYaw) - yaw) * 0.06;\n      pitch += ((my * 0.09 + dragPitch) - pitch) * 0.06;\n      const cyaw = Math.cos(yaw), syaw = Math.sin(yaw);\n      const cpit = Math.cos(pitch), spit = Math.sin(pitch);\n\n      ctx.clearRect(0, 0, W, H);\n      glow.length = 0;\n\n      const HOT = 8.5;\n      for (let i = 0; i < pts.length; i++) {\n        const p = pts[i];\n        // rotate around camera eye (y = 0 is eye height; ground is +GROUND_Y below)\n        const z0 = p.z - dollyE;\n        const xz = p.x * cyaw + z0 * syaw;\n        const zz = -p.x * syaw + z0 * cyaw;\n        const yy = p.y * cpit - zz * spit;\n        const zf = p.y * spit + zz * cpit;\n        if (zf < 1.4) continue;\n        const sc = f / zf;\n        const sx = cx + xz * sc;\n        const sy = cy + yy * sc;\n        if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;\n\n        const revealed = !firstPass || p.z >= minReached;\n        if (revealed) p.lit += (1 - p.lit) * 0.06;\n\n        // scan-front ignition\n        const dz = p.z - scanZ;\n        let hot = 0;\n        if (dz > -HOT && dz < HOT) hot = 1 - Math.abs(dz) / HOT;\n        hot = hot * hot;\n\n        // cursor \"torch\" — ignite points near the pointer\n        let torch = 0;\n        if (curOn) {\n          const dc = Math.hypot(sx - curX, sy - curY);\n          if (dc < TORCH) { const tb = 1 - dc / TORCH; torch = tb * tb; }\n        }\n        // click scan pulses — expanding ring of ignition\n        let pul = 0;\n        for (let k = 0; k < pulses.length; k++) {\n          const pr = pulses[k].t * 720;\n          const dd = Math.abs(Math.hypot(sx - pulses[k].x, sy - pulses[k].y) - pr);\n          if (dd < 62) { const pb = (1 - dd / 62) * Math.max(0, 1 - pulses[k].t * 0.55); if (pb > pul) pul = pb; }\n        }\n\n        const ig = Math.max(hot, torch * 0.95, pul);\n\n        // depth atmosphere\n        const depthFade = Math.max(0.12, 1 - (zf - Z_NEAR) / (Z_FAR * 1.05));\n\n        let a, cr, cg, cb;\n        if (!revealed && ig < 0.02) {\n          a = 0.05 * depthFade; cr = C.building[0]; cg = C.building[1]; cb = C.building[2];\n        } else {\n          const baseA = (0.34 + 0.34 * depthFade) * Math.max(p.lit, ig);\n          a = Math.min(1, baseA + ig * 0.6);\n          cr = p.c[0] + (C.hot[0] - p.c[0]) * ig;\n          cg = p.c[1] + (C.hot[1] - p.c[1]) * ig;\n          cb = p.c[2] + (C.hot[2] - p.c[2]) * ig;\n        }\n\n        let size = sc * p.s;\n        size = Math.max(0.5, Math.min(5, size)) + ig * 2.8;\n\n        ctx.globalAlpha = a;\n        ctx.fillStyle = 'rgb(' + (cr | 0) + ',' + (cg | 0) + ',' + (cb | 0) + ')';\n        ctx.fillRect(sx - size / 2, sy - size / 2, size, size);\n\n        if (ig > 0.4) glow.push([sx, sy, size, ig]);\n      }\n\n      // bloom pass for ignited points\n      ctx.globalCompositeOperation = 'lighter';\n      for (let i = 0; i < glow.length; i++) {\n        const g = glow[i];\n        const rad = g[2] * 3.2;\n        ctx.globalAlpha = 0.16 * g[3];\n        ctx.fillStyle = 'rgb(120,180,235)';\n        ctx.fillRect(g[0] - rad, g[1] - rad, rad * 2, rad * 2);\n      }\n      ctx.globalCompositeOperation = 'source-over';\n\n      // explicit horizontal sweep line on the road plane (centre-line ground point)\n      {\n        const z = Math.max(Z_NEAR + 0.5, scanZ);\n        const pr = project(0, GROUND_Y, z, cyaw, syaw, cpit, spit);\n        if (pr && scanZ > Z_NEAR - 2) {\n          const grad = ctx.createLinearGradient(0, 0, W, 0);\n          grad.addColorStop(0, 'rgba(78,160,224,0)');\n          grad.addColorStop(0.5, 'rgba(150,205,250,0.6)');\n          grad.addColorStop(1, 'rgba(78,160,224,0)');\n          ctx.globalAlpha = 0.85;\n          ctx.fillStyle = grad;\n          const th = Math.max(1.3, pr.sc * 0.04);\n          ctx.fillRect(0, pr.sy - th, W, th * 2);\n        }\n      }\n\n      // ── feature inventory tags + measurement lines ──\n      ctx.lineWidth = 1;\n      for (let i = 0; i < FEATURES.length; i++) {\n        const ft = FEATURES[i];\n        const el = tagEls[i];\n        const top = project(ft.x, ft.topY, ft.z, cyaw, syaw, cpit, spit);\n        const
